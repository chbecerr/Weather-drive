<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Drive</title>
  <meta name="description" content="See the weather you'll drive through on the way to your destination.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌦️ Weather Drive</h1>
    <p>Enter where you're going and see the weather you'll meet along the way.</p>
  </header>

  <main>
    <form id="trip-form" autocomplete="off">
      <label>
        <span>From</span>
        <div class="row">
          <input id="origin" type="text" placeholder="Starting address or city">
          <button type="button" id="locate" title="Use my current location">📍 Use my location</button>
        </div>
      </label>
      <label>
        <span>To</span>
        <input id="destination" type="text" placeholder="Destination address or city" required>
      </label>
      <div class="row wrap">
        <label class="grow">
          <span>Departure</span>
          <input id="depart" type="datetime-local">
        </label>
        <label>
          <span>Units</span>
          <select id="units">
            <option value="imperial">°F · mph</option>
            <option value="metric">°C · km/h</option>
          </select>
        </label>
      </div>
      <button type="submit" id="go">Check the weather on my route</button>
      <p id="accuracy-note" class="note" hidden></p>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <section id="results" hidden>
      <div id="summary"></div>
      <div id="map" aria-label="Route map"></div>
      <h2>Along the way</h2>
      <ol id="timeline"></ol>
    </section>
  </main>

  <footer>
    <p>
      Forecasts by <a href="https://open-meteo.com/">Open-Meteo</a> ·
      Routing by <a href="https://project-osrm.org/">OSRM</a> ·
      Geocoding &amp; map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.
      Always check official road and weather advisories before driving.
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
